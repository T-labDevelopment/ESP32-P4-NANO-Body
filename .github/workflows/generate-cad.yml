name: Rebuild and version CAD outputs

on:
  push:
    branches: [main]
    paths:
      - 'rev-a/**'
      - 'rev-b/**'
      - 'rev-c/**'
      - 'rev-d/**'
      - '.github/workflows/generate-cad.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-cad:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: rev-b/requirements.txt

      - name: Install fixed CAD dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r rev-b/requirements.txt

      - name: Generate Rev.A models
        run: python rev-a/generate_enclosure.py

      - name: Generate Rev.B models
        run: python rev-b/generate_enclosure.py

      - name: Generate Rev.C models and front-fit coupons
        run: python rev-c/generate_enclosure.py

      - name: Generate Rev.D models and fitting coupons
        run: python rev-d/generate_enclosure.py

      - name: Verify output files exist
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            rev-a/ESP32_P4_NANO_Upper_print.stl \
            rev-a/ESP32_P4_NANO_Bottom_print.stl \
            rev-a/ESP32_P4_NANO_Enclosure_RevA_assembly.step \
            rev-b/ESP32_P4_NANO_RevB_upper_print.stl \
            rev-b/ESP32_P4_NANO_RevB_bottom_print.stl \
            rev-b/ESP32_P4_NANO_RevB_assembly.step \
            rev-c/ESP32_P4_NANO_RevC_upper_print.stl \
            rev-c/ESP32_P4_NANO_RevC_bottom_print.stl \
            rev-c/ESP32_P4_NANO_RevC_front_coupon_upper.stl \
            rev-c/ESP32_P4_NANO_RevC_front_coupon_bottom.stl \
            rev-c/ESP32_P4_NANO_RevC_assembly.step \
            rev-d/ESP32_P4_NANO_RevD_upper_print.stl \
            rev-d/ESP32_P4_NANO_RevD_bottom_print.stl \
            rev-d/ESP32_P4_NANO_RevD_front_coupon_upper.stl \
            rev-d/ESP32_P4_NANO_RevD_front_coupon_bottom.stl \
            rev-d/ESP32_P4_NANO_RevD_assembly.step; do
            test -s "$file" || { echo "Missing/empty: $file"; exit 1; }
          done

      - name: Commit regenerated STL and STEP into repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rev-a/*.stl rev-a/*.step rev-b/*.stl rev-b/*.step rev-c/*.stl rev-c/*.step rev-d/*.stl rev-d/*.step
          if ! git diff --cached --quiet; then
            git commit -m "build(cad): regenerate STL and STEP for Rev.A/Rev.B/Rev.C/Rev.D [skip ci]"
            git push origin HEAD:main
          else
            echo "Generated CAD outputs unchanged."
          fi
